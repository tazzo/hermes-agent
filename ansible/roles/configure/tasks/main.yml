---
# Hermes configuration — bootstrap defaults ONLY if missing (per-file force: no)
# User-managed state (config.yaml, .env, auth.json) is NEVER overwritten on rebuilds
# (option A: persistent home = ready base).

- name: Ensure .hermes directory exists
  file:
    path: /home/hermes/.hermes
    state: directory
    owner: hermes
    group: hermes
    mode: '0700'

# Compute scrypt hash for dashboard basic_auth (only needed if config absent).
# EXACT format of plugins/dashboard_auth/basic.hash_password:
#   scrypt$16384$8$1$<b64(salt)>$<b64(dk)> — STANDARD base64 WITH padding,
#   maxmem=0. (urlsafe/no-padding variants fail verification — verified 2026-08-12.)
- name: Compute dashboard password hash (scrypt, exact hermes format)
  vars:
    dash_hash_script: |
      import hashlib, base64, os
      pw = os.environ['DASHBOARD_PASSWORD']
      salt = os.urandom(16)
      dk = hashlib.scrypt(pw.encode(), salt=salt, n=16384, r=8, p=1, dklen=32, maxmem=0)
      print('scrypt$16384$8$1$' + base64.b64encode(salt).decode() + '$' + base64.b64encode(dk).decode())
  command: python3 -c "{{ dash_hash_script }}"
  environment:
    DASHBOARD_PASSWORD: "{{ lookup('env', 'DASHBOARD_PASSWORD') }}"
  register: dash_hash
  changed_when: false
  when: lookup('env', 'DASHBOARD_PASSWORD') | length > 0
  no_log: true

- name: Deploy config.yaml (only if absent — user config wins on rebuilds)
  template:
    src: config.yaml.j2
    dest: /home/hermes/.hermes/config.yaml
    owner: hermes
    group: hermes
    mode: '0644'
    force: no
  vars:
    dashboard_password_hash: "{{ dash_hash.stdout if dash_hash.stdout is defined else '' }}"

- name: Deploy SOUL.md (only if absent)
  template:
    src: SOUL.md.j2
    dest: /home/hermes/.hermes/SOUL.md
    owner: hermes
    group: hermes
    mode: '0644'
    force: no

- name: Deploy .env (only if absent — user-entered API keys win on rebuilds)
  template:
    src: .env.j2
    dest: /home/hermes/.hermes/.env
    owner: hermes
    group: hermes
    mode: '0600'
    force: no

# GROQ_API_KEY: idempotent provisioning into the EXISTING .env (which is
# user-managed and never overwritten on rebuilds). The value comes from gopass
# via env var exported at playbook run (export GROQ_API_KEY=$(gopass show -o <path>)).
# no_log: the key never lands in Ansible output or logs.
- name: Ensure GROQ_API_KEY present in .env (IaC provisioning, idempotent)
  lineinfile:
    path: /home/hermes/.hermes/.env
    regexp: '^GROQ_API_KEY='
    line: "GROQ_API_KEY={{ lookup('env', 'GROQ_API_KEY') }}"
    create: yes
    mode: '0600'
    owner: hermes
    group: hermes
  when: lookup('env', 'GROQ_API_KEY') | length > 0
  no_log: true

# auth.json (OAuth creds from dashboard onboarding) is NEVER touched by Ansible.

# NOTE: polkit rule for Hermes self-restart lives in the BASELINE role
# (50-hermes-services.rules — covers gateway + dashboard + hermes-restart unit).
# A duplicate rule deployed here (50-hermes-gateway.rules) was removed 2026-08-14
# to avoid two overlapping rules.

# ── Caddy research publisher (user space, no root in lifecycle) ────────────
# Hermes publishes web-search results on :8080 (VPN-only) via a systemd USER
# unit. User units are managed by hermes with systemctl --user — no polkit
# rule needed (user units don't require it) and no sudo.

- name: Enable linger for hermes (user manager survives logout, starts at boot)
  command: loginctl enable-linger hermes
  changed_when: false
  register: linger_result

- name: Verify linger is enabled
  command: loginctl show-user hermes -p Linger
  register: linger_check
  changed_when: false
  failed_when: "'Linger=yes' not in linger_check.stdout"

- name: Install Caddy (system binary; service runs as user hermes)
  apt:
    name: caddy
    state: present
    lock_timeout: 600

- name: Ensure user systemd unit directory exists
  file:
    path: /home/hermes/.config/systemd/user
    state: directory
    owner: hermes
    group: hermes
    mode: '0755'

- name: Deploy hermes-research user unit
  template:
    src: hermes-research.service.j2
    dest: /home/hermes/.config/systemd/user/hermes-research.service
    owner: hermes
    group: hermes
    mode: '0644'

- name: Reload user systemd daemon
  become: yes
  become_user: hermes
  become_method: sudo
  command: systemctl --user daemon-reload
  changed_when: false

- name: Enable and start hermes-research (user unit)
  become: yes
  become_user: hermes
  become_method: sudo
  command: systemctl --user enable --now hermes-research.service
  changed_when: false

- name: Run hermes config check (safe every run)
  shell: sudo -u hermes /home/hermes/.local/bin/hermes config check
  environment:
    HOME: /home/hermes
    USER: hermes
  register: config_check
  changed_when: false
  failed_when: false

- name: Ensure all hermes files and directories are owned by hermes user
  file:
    path: "{{ item }}"
    owner: hermes
    group: hermes
    recurse: yes
  loop:
    - /home/hermes/.hermes
    - /home/hermes/.local
    - /home/hermes/.npm

- name: Enable and restart hermes services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
    daemon_reload: yes
  loop:
    - hermes-gateway.service
    - hermes-dashboard.service
